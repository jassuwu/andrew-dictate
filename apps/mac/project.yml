name: AndrewDictate
options:
  bundleIdPrefix: gg.jass
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    # pinned, not ranged: the generated .xcodeproj is gitignored, so its
    # Package.resolved never reaches CI and `from:` let every release
    # resolve whatever was newest that morning. 0.15.6 arrived unable to
    # compile for x86_64 and took a release build with it.
    exactVersion: 0.15.5

targets:
  AndrewDictate:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - Resources
      - path: Sources/Resources/Sounds/dictation-start.wav
        buildPhase: resources
      - path: Sources/Resources/Sounds/dictation-end.wav
        buildPhase: resources
      # copied as a folder so ATSApplicationFontsPath can point at it.
      - path: Sources/Resources/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: FluidAudio
    settings:
      base:
        PRODUCT_NAME: Andrew Dictate
        PRODUCT_MODULE_NAME: AndrewDictate
        PRODUCT_BUNDLE_IDENTIFIER: gg.jass.dictate
        # apple silicon only, as the spec has always said. the intel slice
        # could never run this app and was pure build cost.
        ARCHS: arm64
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: false
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # the brand gold as the app accent: native controls, pane icons,
        # toggles and pickers take it system-wide instead of per-view tints.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # a debug build is a *different app* to macOS: its own bundle id, so
        # its own TCC grants, its own UserDefaults, and (via AppIdentity) its
        # own application-support folder. that is what lets a development build
        # and the shipped one sit on the same mac without fighting over
        # permissions or writing to the same archive.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: gg.jass.dictate.dev
          PRODUCT_NAME: Andrew Dictate Dev
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleShortVersionString: "0.8.0"
        CFBundleVersion: "3"
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "© 2026 jass. MIT license."
        ATSApplicationFontsPath: Fonts
        NSMicrophoneUsageDescription: "andrew dictate uses your microphone for local dictation. with pre-roll on, the mic stays warm while the app runs."

  AndrewDictateTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - path: Sources/Cleanup
        excludes:
          - CleanupLabView.swift
          - PipelinePlaygroundView.swift
          - WordFixerView.swift
      - Sources/Audio/RingSplicer.swift
      - Sources/Audio/TapHealthMonitor.swift
      - Sources/Archive/Dictation.swift
      - Sources/Archive/DictationArchive.swift
      - Sources/Archive/MeetingSession.swift
      - Sources/Archive/ArchiveBrowserViewModel.swift
      - Sources/About/UpdateCheck.swift
      - path: Sources/Meetings
        excludes:
          - LiveTranscriptView.swift
          - LiveTranscriptPanel.swift
      - Sources/Settings/MeetingsListModel.swift
      - Sources/Onboarding/OnboardingMeetingSetup.swift
      - Sources/App/AppIdentity.swift
      - Sources/App/Capabilities.swift
      - Sources/App/RemovalPlan.swift
      - Sources/App/RemovalViewModel.swift
      - Sources/HUD/WaveLevelShaper.swift
      - Sources/HUD/HUDLayoutEngine.swift
      - Sources/Settings/AppSettings.swift
      - Sources/Settings/EngineSwitchState.swift
      - Sources/Onboarding/OnboardingState.swift
      - Sources/Onboarding/OnboardingFlow.swift
      - Sources/Permissions/SetupGate.swift
      - Sources/Settings/SetupHealth.swift
      - Sources/Hotkey/HotkeyBinding.swift
      - Sources/Hotkey/TapLockDetector.swift
      - Sources/Insertion/FocusAnchor.swift
      - Sources/Instrumentation/UtteranceTimeline.swift
      - Sources/Instrumentation/TimelineSummary.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  AndrewDictate:
    build:
      targets:
        AndrewDictate: all
        AndrewDictateTests:
          - test
    test:
      config: Debug
      targets:
        - AndrewDictateTests
