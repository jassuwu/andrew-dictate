name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # dry run: test + build + dmg, no release, no tap bump

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mac
    steps:
      # depth 0, not shallow: the release notes derive the change list from
      # the commits since the previous tag, and a shallow clone has neither.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: resolve version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "invalid release tag: $GITHUB_REF_NAME (expected vMAJOR.MINOR.PATCH)" >&2
              exit 1
            fi
            # the notes are hand-written, and a tag without a section is how
            # four releases shipped the same body. fail in the first step, not
            # after a 45-minute build.
            if ! head -1 RELEASE_NOTES.md | grep -qx "## ${GITHUB_REF_NAME#v}"; then
              echo "RELEASE_NOTES.md does not start with ## ${GITHUB_REF_NAME#v}" >&2
              exit 1
            fi
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "PUBLISH=true" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dry" >> "$GITHUB_ENV"
            echo "PUBLISH=false" >> "$GITHUB_ENV"
          fi

      - name: use xcode 26
        # the floor is macOS 26 (61765cd): glassEffect, Tab(value:),
        # FoundationModels. the runner's default xcode may be older.
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "no Xcode 26 on this runner:"; ls /Applications | grep -i xcode; exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: tools
        run: brew install xcodegen

      - name: stamp version and generate project
        run: |
          sed -i '' "s/CFBundleShortVersionString: \".*\"/CFBundleShortVersionString: \"$VERSION\"/" project.yml
          sed -i '' "s/CFBundleVersion: \".*\"/CFBundleVersion: \"$GITHUB_RUN_NUMBER\"/" project.yml
          xcodegen generate

      - name: test
        run: |
          xcodebuild -project AndrewDictate.xcodeproj -scheme AndrewDictate \
            -configuration Debug test -destination 'platform=macOS' \
            -derivedDataPath .build

      - name: build release
        run: |
          xcodebuild -project AndrewDictate.xcodeproj -scheme AndrewDictate \
            -configuration Release build -derivedDataPath .build

      - name: sign
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          APP=".build/Build/Products/Release/Andrew Dictate.app"
          if [ -n "$SIGNING_CERT_P12" ]; then
            # stable self-signed identity: keeps the TCC designated requirement
            # constant across releases so accessibility grants survive updates
            echo "$SIGNING_CERT_P12" | base64 -d > /tmp/sign.p12
            security create-keychain -p "" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "" build.keychain
            security import /tmp/sign.p12 -k build.keychain -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain > /dev/null
            codesign --force --deep -s "Andrew Dictate Signing" "$APP"
            rm -f /tmp/sign.p12
          else
            # ad-hoc: the signature changes every build, so brew sees a new
            # signer on upgrade and the "your approval carries over" copy in
            # the readme, the site and the release notes stops being true.
            # don't ship a release from this branch.
            echo "no signing cert secret — falling back to ad-hoc"
            codesign --force --deep -s - "$APP"
          fi

      - name: dmg
        run: |
          APP=".build/Build/Products/Release/Andrew Dictate.app"
          STAGE="$(mktemp -d)"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          if [ -f art/AndrewDictate.icns ]; then
            cp art/AndrewDictate.icns "$STAGE/.VolumeIcon.icns"
            SetFile -a C "$STAGE" 2>/dev/null || true
          fi
          hdiutil create -volname "Andrew Dictate" -srcfolder "$STAGE" -ov -format UDZO "AndrewDictate-$VERSION.dmg"
          shasum -a 256 "AndrewDictate-$VERSION.dmg" | awk '{print $1}' > dmg.sha256
          echo "dmg sha256: $(cat dmg.sha256)"

      - name: version smoke
        run: |
          MOUNT="$(hdiutil attach "AndrewDictate-$VERSION.dmg" -nobrowse -readonly | grep -o '/Volumes/.*' | tail -1)"
          ACTUAL="$(defaults read "$MOUNT/Andrew Dictate.app/Contents/Info.plist" CFBundleShortVersionString)"
          hdiutil detach "$MOUNT" -quiet
          if [ "$ACTUAL" != "$VERSION" ]; then
            echo "version smoke failed: dmg app reports $ACTUAL, tag says $VERSION" >&2
            exit 1
          fi
          echo "version smoke ok: $ACTUAL"

      # three lines a person wrote, the commit log folded underneath, and the
      # install block last. --generate-notes gave a compare link and nothing
      # else, because the work lands as commits rather than pull requests.
      - name: release notes
        if: env.PUBLISH == 'true'
        run: |
          awk -v section="## $VERSION" '
            $0 == section { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' RELEASE_NOTES.md > notes.md

          PREV="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || echo "")"
          if [ -n "$PREV" ]; then
            CHANGES="$(git log --no-merges --reverse --pretty=%s "$PREV..$GITHUB_REF_NAME" \
              | grep -E '^(feat|fix)(\(|:)' \
              | sed -E 's/^feat[^:]*: /- new: /; s/^fix[^:]*: /- fixed: /' || true)"
          else
            CHANGES=""
          fi
          if [ -n "$CHANGES" ]; then
            COUNT="$(printf '%s\n' "$CHANGES" | wc -l | tr -d ' ')"
            {
              echo "<details><summary>every change in $VERSION ($COUNT commits)</summary>"
              echo
              printf '%s\n' "$CHANGES"
              echo "</details>"
            } >> notes.md
          fi

          {
            echo
            echo '---'
            echo
            echo "install: \`brew install --cask jassuwu/tap/andrew-dictate\`, then \`xattr -dr com.apple.quarantine \"/Applications/Andrew Dictate.app\"\`, then \`open \"/Applications/Andrew Dictate.app\"\`. no dock icon — look for the gold badge in your menu bar."
            echo
            echo "update: \`brew upgrade --cask jassuwu/tap/andrew-dictate\` — no xattr needed, your approval carries over"
            echo
            echo "sha256: $(cat dmg.sha256)"
          } >> notes.md
          cat notes.md

      - name: github release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "AndrewDictate-$VERSION.dmg" \
            --title "Andrew Dictate $VERSION" \
            --verify-tag \
            --notes-file notes.md

      - name: bump tap cask
        if: env.PUBLISH == 'true'
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "TAP_DEPLOY_KEY secret missing — skipping tap bump"
            exit 0
          fi
          SHA="$(cat dmg.sha256)"
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes"
          git clone git@github.com:jassuwu/homebrew-tap.git tap
          cd tap
          sed -i '' "s/version \".*\"/version \"$VERSION\"/" Casks/andrew-dictate.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"$SHA\"/" Casks/andrew-dictate.rb
          git config user.name "andrew-dictate release bot"
          git config user.email "release@jass.gg"
          git add Casks/andrew-dictate.rb
          git commit -m "andrew-dictate $VERSION"
          git push origin HEAD
